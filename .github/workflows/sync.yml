name: Sync the cask and the formula with the latest releases
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-cask.mjs
      - name: Commit the cask when its release moved
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/joxo.rb; then echo 'Cask unchanged.'; exit 0; fi
          git config user.name 'joxo-release-bot'
          git config user.email 'support@joxo.ai'
          git add Casks/joxo.rb
          git commit -m "sync: cask $(grep -o 'version "[^"]*"' Casks/joxo.rb)"
          git push
      # The formula installs an executable on people's computers, so a change to it is reviewed:
      # the sync opens a pull request and never pushes it to main.
      - run: node scripts/sync-formula.mjs
        continue-on-error: true # the cask above is already committed if the connector release is incomplete
      - name: Open a pull request when the formula's release moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/joxo-cli.rb; then echo 'Formula unchanged.'; exit 0; fi
          version=$(grep -o '^  version "[^"]*"' Formula/joxo-cli.rb | grep -o '"[^"]*"' | tr -d '"')
          branch="sync/formula-$version"
          git config user.name 'joxo-release-bot'
          git config user.email 'support@joxo.ai'
          git checkout -B "$branch"
          git add Formula/joxo-cli.rb
          git commit -m "sync: formula $version"
          git push --force-with-lease origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number -q '.[0].number')" ]; then
            gh pr create --base main --head "$branch" --title "Formula joxo-cli $version" \
              --body "Synced from the connector-v$version release: version and SHA-256s, taken from its signed binary-manifest.json. Review, then merge."
          fi
